<rect x="394" y="132" width="168" height="36" rx="18" fill="#8be28b"/>
<text x="466" y="155.5" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1026">Practice now</text>
<text class="go" x="528" y="155.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#0b1026">&#8594;</text>
