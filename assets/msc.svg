<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 190" width="590" height="190" role="img" aria-label="Structural Engineering - Entrance MCQ practice">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset="1" stop-color="#241a5c"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect x="2" y="2" width="586" height="186" rx="18"/></clipPath></defs>
<style>
.fill{transform-box:fill-box;transform-origin:center;animation:fill 5s ease-in-out infinite;animation-delay:1.8s}
@keyframes fill{0%,18%{transform:scale(0)}30%,88%{transform:scale(1)}100%{transform:scale(0)}}
.go{animation:go 1.4s ease-in-out infinite alternate}
@keyframes go{to{transform:translateX(6px)}}
.sw{animation:sw 6s ease-in-out infinite;animation-delay:2.7s}
@keyframes sw{0%,55%{transform:translateX(-260px)}100%{transform:translateX(640px)}}
</style>
<rect x="2" y="2" width="586" height="186" rx="18" fill="url(#g)" stroke="#8be28b" stroke-opacity=".55" stroke-width="2"/>
<g clip-path="url(#r)">
<text x="568" y="128" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="150" font-weight="800" fill="#8be28b" opacity=".1">03</text>
<rect class="sw" x="0" y="0" width="200" height="190" fill="url(#sh)" transform="skewX(-20)"/>
</g>
<rect x="30" y="30" width="5" height="62" rx="2.5" fill="#8be28b"/>
<text x="48" y="44" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#8be28b">IOE M.SC. ENTRANCE</text>
<text x="48" y="76" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">Structural Engineering</text>
<text x="48" y="100" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#b9c0ee">Entrance MCQ practice</text>
