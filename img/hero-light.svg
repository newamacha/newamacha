<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Sanam Maharjan, backend developer in Lalitpur, Nepal. Two SQL Server databases, one ASP.NET Core API and three Next.js portals, shipped by GitHub Actions to IIS." font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#000000" opacity=".07"/></pattern><clipPath id="clip"><rect x="1" y="1" width="838" height="328" rx="14"/></clipPath></defs><rect x="1" y="1" width="838" height="328" rx="14" fill="#f6f8fa" stroke="#d8dee4"/>
<rect x="420" y="1" width="419" height="328" fill="url(#grid)" clip-path="url(#clip)"/>
<text x="40" y="70" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#1f7a5c">BACKEND DEVELOPER  ·  LALITPUR, NEPAL</text>
<text x="38" y="122" font-size="44" font-weight="700" fill="#1f2328">Sanam Maharjan</text>
<text font-size="17" fill="#59636e"><tspan x="40" y="160">I build the part you don't see: the databases,</tspan><tspan x="40" y="184">the APIs and the pipelines that ship them.</tspan></text>
<circle cx="46" cy="231" r="4" fill="#1f7a5c"><animate attributeName="opacity" values="1;.35;1" dur="3.5s" repeatCount="indefinite"/></circle>
<text font-size="14" fill="#1f2328"><tspan x="60" y="236">Now: sole developer of a certification platform</tspan><tspan x="60" y="257">for a client in Sweden, database to deploy.</tspan></text>
<text x="40" y="296" font-size="13" fill="#59636e">C#  ·  ASP.NET Core  ·  SQL Server  ·  Next.js</text>
